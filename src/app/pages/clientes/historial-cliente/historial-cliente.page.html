<ion-header [translucent]="true" class="modern-header">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/clientes"></ion-back-button>
    </ion-buttons>
    <ion-title class="custom-title">Historial - {{ cliente?.nombre || 'Cliente' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <!-- Loading -->
    <div *ngIf="isLoading" class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando historial...</p>
    </div>

    <!-- Error -->
    <div *ngIf="!isLoading && error" class="error">
      {{ error }}
    </div>

    <!-- Historial usando el nuevo componente -->
    <ng-container *ngIf="!isLoading && !error">
      <!-- Resumen de deuda -->
      <app-resumen-deuda
        [mantenciones]="transformarHistorialParaComponente(historialOrdenado)"
        [clienteNombre]="cliente?.nombre || ''"
        [clienteTelefono]="cliente?.telefono || ''">
      </app-resumen-deuda>

      <div *ngIf="(historialOrdenado?.length || 0) > 0; else emptyState">
        <app-historial-mantenciones
          [mantenciones]="transformarHistorialParaComponente(historialOrdenado)"
          [titulo]="'Historial del Cliente'"
          [mostrarFiltros]="true"
          (onMantencionClick)="verDetalleMantencion($event)"
          (onPagoToggle)="togglePago($event)"
          (onBorrarClick)="borrarMantencion($event)">
        </app-historial-mantenciones>
      </div>
      <ng-template #emptyState>
        <div class="empty-state">
          <ion-icon name="time-outline" size="large"></ion-icon>
          <h4>Sin mantenciones registradas</h4>
          <p>Cuando registres mantenciones para este cliente, aparecerán aquí.</p>
        </div>
      </ng-template>
    </ng-container>
  </div>
</ion-content>

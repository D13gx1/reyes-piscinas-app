<ion-content [fullscreen]="true" class="login">

  <div class="login__fondo" aria-hidden="true">
    <svg class="login__ola" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,64 C240,120 480,0 720,48 C960,96 1200,24 1440,64 L1440,120 L0,120 Z" />
    </svg>
  </div>

  <main class="login__contenido">

    <header class="login__marca">
      <div class="login__logo">
        <img src="assets/reyes-piscinas.png" alt="Reyes Piscinas" />
      </div>
      <h1>Reyes Piscinas</h1>
      <p>Mantenciones, clientes y cobros en un solo lugar</p>
    </header>

    <section class="login__tarjeta">
      <h2>Bienvenido</h2>
      <p class="login__ayuda">Inicia sesión con tu cuenta de Google para continuar.</p>

      <ion-button
        class="login__google"
        expand="block"
        fill="clear"
        (click)="loginWithGoogle()"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <ion-spinner name="crescent" color="primary"></ion-spinner>
        } @else {
          <img src="assets/google-icon.svg" alt="" class="login__google-icono" />
        }
        <span>{{ isLoading ? 'Conectando…' : 'Continuar con Google' }}</span>
      </ion-button>

      @if (errorMessage) {
        <div class="login__error" role="alert">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>{{ errorMessage }}</span>
        </div>
      }
    </section>

    <footer class="login__pie">
      Solo personal autorizado
    </footer>

  </main>

</ion-content>

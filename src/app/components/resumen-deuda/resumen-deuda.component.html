<!-- ===== DEUDA DEL CLIENTE ===== -->
<section class="deuda" *ngIf="resumenDeuda.cantidadPendientes > 0; else sinDeuda">
  <div class="deuda-head">
    <button type="button" class="deuda-toggle" (click)="toggleExpandido()" [attr.aria-expanded]="expandido">
      <span class="deuda-icono" aria-hidden="true">
        <ion-icon name="cash-outline"></ion-icon>
      </span>
      <span class="deuda-texto">
        <span class="deuda-titulo">Por cobrar <strong class="precio-tag por-cobrar">{{ formatearPrecio(resumenDeuda.totalPendiente) }}</strong></span>
        <span class="deuda-sub">
          {{ resumenDeuda.cantidadPendientes }} {{ resumenDeuda.cantidadPendientes === 1 ? 'mantención sin pagar' : 'mantenciones sin pagar' }}
          <ion-icon class="chevron" name="chevron-down-outline" aria-hidden="true"></ion-icon>
        </span>
      </span>
    </button>

    <!-- Abre WhatsApp con el mensaje listo: el envío lo haces tú -->
    <button type="button" class="whatsapp" (click)="enviarPorWhatsApp()" *ngIf="resumenDeuda.clienteTelefono"
            aria-label="Recordar el pago por WhatsApp">
      <ion-icon name="logo-whatsapp"></ion-icon>
      <span>Recordar</span>
    </button>
  </div>

  <!-- Detalle: qué fechas se deben -->
  <ul class="deuda-lista" *ngIf="expandido">
    <li *ngFor="let m of resumenDeuda.mantencionesPendientes">
      <span>{{ formatearFecha(m.fecha) }}</span>
      <span class="precio-tag por-cobrar">{{ formatearPrecio(m.precio) }}</span>
    </li>
  </ul>
</section>

<!-- Sin deuda -->
<ng-template #sinDeuda>
  <div class="al-dia">
    <ion-icon name="checkmark-circle-outline"></ion-icon>
    <span><strong>Todo al día.</strong> No hay mantenciones por cobrar.</span>
  </div>
</ng-template>
